grasp_perception:
  ros__parameters:
    base_frame: panda_link0
    # realsense2_camera (ROS 2 wrapper 4.x) on the wrist, pointcloud.enable:=true
    cloud_topic: /camera/camera/depth/color/points
    frame_timeout: 2.0
    num_grasp_markers: 5

    segmentation:
      crop_min: [0.15, -0.4, -0.05]  # workspace in panda_link0 [m]: protocol poses +- object size
      crop_max: [0.85, 0.4, 0.4]
      voxel_leaf: 0.003
      outlier_mean_k: 30
      outlier_stddev: 2.0             # 1.0 also strips object edges (~3 mm per side)
      plane_distance: 0.008          # RANSAC inlier threshold
      plane_max_angle: 0.15          # table normal within ~8.6 deg of +z
      plane_max_iterations: 500
      min_height_above_plane: 0.008
      cluster_tolerance: 0.015
      min_cluster_size: 80
      max_cluster_size: 50000
      normal_radius: 0.012

    # Franka Hand
    gripper:
      max_width: 0.08
      finger_length: 0.045
      finger_width: 0.02
      finger_thickness: 0.012
      palm_depth: 0.06
      palm_width: 0.20
      palm_thickness: 0.06
      open_clearance: 0.01

    contour:
      resolution: 0.002
      closing_radius: 2
      min_area: 0.0002
      top_layer_thickness: 0.02      # top-surface layer used for the outline (paper: 2 cm)

    grasp:
      efd_harmonics: 20
      contour_samples: 120
      friction_coefficient: 0.4      # cone half-angle atan(0.4) = 21.8 deg
      min_width: 0.005
      flatness_length: 0.01
      max_pairs_per_object: 200
      max_grasp_depth: 0.04
      min_contact_depth: 0.006
      depth_step: 0.005
      pregrasp_distance: 0.10
      table_clearance: 0.004
      min_support_points: 8
      support_saturation: 40.0
      max_intruding_points: 3
      nms_distance: 0.01
      nms_angle: 0.3
      max_candidates: 20
      x_axis_hint: [1.0, 0.0, 0.0]

    weights:
      antipodal: 1.0
      support: 0.5
      centroid: 0.75
      flatness: 0.5
      width_margin: 0.25
      depth: 0.5
