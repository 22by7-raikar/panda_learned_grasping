pick_place:
  ros__parameters:
    arm_group: panda_arm
    hand_group: hand

    # ompl_transit_ik_approach (default) or ik_goal_ompl; see the README for the comparison
    mode: ompl_transit_ik_approach
    # OMPL planner config names from moveit_resources_panda_moveit_config/config/ompl_planning.yaml
    planner_id: RRTConnectkConfigDefault    # or PRMkConfigDefault
    planning_time: 2.0
    planning_attempts: 1
    velocity_scaling: 0.3
    acceleration_scaling: 0.3

    # Scan pose from the benchmarking study: TCP at (0.45, 0, 0.737) pointing down, which
    # puts the wrist camera 0.80 m above the table looking straight down at (0.50, 0).
    observe_joints: [0.0, 0.125, 0.0, -0.745, 0.0, 0.871, 0.785]
    # Same pose rotated about joint 1: a drop-off spot to the robot's right.
    place_joints: [-0.9, 0.125, 0.0, -0.745, 0.0, 0.871, -0.115]

    pregrasp_distance: 0.10
    lift_distance: 0.10
    table_height: 0.0

    # moveit = the "hand" MoveIt group (mock hardware / simulation)
    # action = control_msgs/GripperCommand (franka_gripper on the real robot)
    gripper_mode: moveit
    gripper_action: /panda_gripper/gripper_action

    # /grasp_perception/detect_grasps (classical EFD) or /grasp_learning/detect_grasps (Faster R-CNN)
    grasp_service: /grasp_perception/detect_grasps
    max_grasp_attempts: 5
    cycles: 1                    # <= 0: keep going until no grasp is found
    benchmark_csv: /tmp/pick_place_benchmark.csv

    # Benchmark trial mode (scripts/benchmark_protocol.py drives ~/run_trial).
    serve_trials: false
    protocol:
      enabled: false
      lift_height: 0.40            # TCP height above the table after lifting
      # Yaw: joint 7 by +45, -90, +45 deg (back to start).
      yaw_angle: 0.7854
      # Shake as run by the lab's benchmarking code: joint 5 (index 4) by
      # +22.5, -45, +45, -45, +22.5 deg. The paper's text says "pitching +-45 deg"; set
      # shake_joint: 5 (joint 6) and shake_angle: 0.7854 to follow the text instead.
      shake_joint: 4
      shake_angle: 0.3927
      shake_cycles: 2
      shake_velocity_scaling: 0.5   # benchmarking_velocity in the lab's code
      held_check: gripper          # or operator
